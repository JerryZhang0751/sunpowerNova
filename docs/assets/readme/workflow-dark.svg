    <rect x="600" y="472" width="170" height="44" rx="22" fill="#ffbd52"/>
    <text x="685" y="500" fill="#0b1f3a" font-size="16" font-weight="600" text-anchor="middle">人工审核</text>
    <line x1="772" y1="494" x2="830" y2="494" stroke="#8c959f" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7"/>
    <path d="M832 494 L816 486 L816 502 Z" fill="#8c959f"/>
    <rect x="832" y="472" width="188" height="44" rx="22" fill="#58a6ff"/>
    <text x="926" y="500" fill="#07182d" font-size="16" font-weight="600" text-anchor="middle">独立发布到 SunHestia</text>
