    <path d="M760 397 V438 L685 475" fill="none" stroke="#8c959f" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7"/>
    <path d="M685 475 L695 461 L702 476 Z" fill="#8c959f"/>
