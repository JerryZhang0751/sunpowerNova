[project]
name = "geo"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "dashscope>=1.20",
  "openai>=1.40",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "trafilatura>=1.12",
  "PyYAML>=6.0",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "Jinja2>=3.1",
  "google-api-python-client>=2.130",
  "google-auth>=2.30",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Hard hang defense: the suite once hung indefinitely when a real API call leaked
# in (commit 1a06ab5). 300s per test is far above any legitimate test (~2s suite).
timeout = 300

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
