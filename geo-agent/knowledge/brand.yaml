faqs:
- id: faq-system-includes
  q: What does a residential solar and storage system include?
  a: Typically rooftop solar panels, a hybrid inverter, and a home battery. The panels
    produce electricity, the inverter routes it to your home or the battery, and the
    battery stores surplus for use after dark.
- id: faq-battery-size
  q: How big should my battery be?
  a: Battery size should match your evening electricity use. A common starting point
    for a detached home is 5–10 kWh, stackable to around 15 kWh. We size it based
    on your actual consumption, not a one-size-fits-all figure.
- id: faq-battery-needed
  q: Do I need a battery with solar panels?
  a: Solar works without a battery, but without storage most daytime surplus is exported
    to the grid. A battery lets you keep and use that energy yourself, which is usually
    better value than selling low and buying back high.
- id: faq-roof-types
  q: What roof types are suitable?
  a: Pitched tile and metal roofs, flat roofs on garages, and ground-mounted frames
    where the main roof is shaded. Orientation and shading affect yield, so we assess
    each roof individually.
- id: faq-install-time
  q: How long does installation take?
  a: For a typical detached home, the physical installation is often completed within
    a day once the system is designed and the hardware is on site.
- id: faq-warranty
  q: What warranty do you offer?
  a: PV modules carry a 25-year linear performance guarantee, and the LiFePO4 home
    battery carries a 10-year warranty.
glossary:
- id: self-consumption
  term: Self-consumption
  definition: The share of the electricity your solar panels produce that you use
    in your own home, rather than exporting to the grid. It is the single number that
    most influences the value of a residential solar system; storage shifts surplus
    to when it is needed, sharply increasing self-consumption.
- id: lifepo4
  term: LiFePO4
  definition: Lithium iron phosphate battery chemistry used for SunHestia home batteries.
    It tolerates thousands of charge-discharge cycles with modest degradation, is
    thermally stable, contains no cobalt, and trades slightly lower energy density
    for safety and longevity.
- id: hybrid-inverter
  term: Hybrid inverter
  definition: 'The control component of the system: it converts solar DC power into
    the alternating current the home uses, directs surplus into the battery, and only
    draws from the grid when needed.'
