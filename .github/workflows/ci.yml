name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}   # push 事件偶发被 Actions 丢弃(2026-08-26 三连),留手动强制触发口

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -r ./geo-agent/requirements.lock

      - name: Test
        working-directory: geo-agent
        # No secrets needed: Settings fields all have defaults; live tests are
        # auto-skipped by conftest; network-dependent paths are mocked.
        run: python -m pytest

  # 2026-08-25 二次审查#9: `astro check` 缺依赖时只打印安装提示不执行检查,
  # 构建通过不能证明类型检查通过 —— site 静态检查必须成为真门禁。
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Static check (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: TOC integrity (news articles)
        run: npm run checktoc
