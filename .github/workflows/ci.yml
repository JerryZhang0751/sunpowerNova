name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e "./geo-agent[dev]"

      - name: Test
        working-directory: geo-agent
        # No secrets needed: Settings fields all have defaults; live tests are
        # auto-skipped by conftest; network-dependent paths are mocked.
        run: python -m pytest
